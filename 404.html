<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="robots" content="noindex"/>
<title>Page Not Found — Kaya Botanicals</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<link rel="icon" href="/favicon.ico" sizes="32x32"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Roboto+Condensed:wght@300;400&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0D0B09;--gold:#B8872E;--gold2:#CCA04A;--gold3:#DCBA78;--cream:#EDE8DE;
--txt2:rgba(237,232,222,.52);--border:rgba(184,135,46,.16);--border2:rgba(184,135,46,.32);
--fd:'Cinzel',serif;--fi:'Roboto Condensed',sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--cream);font-family:var(--fi);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:560px;width:100%}
.mark{width:56px;height:56px;margin:0 auto 36px;opacity:.9}
.code{font-family:var(--fd);font-size:clamp(4rem,14vw,7rem);font-weight:400;letter-spacing:.18em;color:var(--gold3);line-height:1}
.rule{display:block;width:72px;height:1px;background:var(--gold);margin:28px auto}
h1{font-family:var(--fd);font-size:clamp(1rem,3vw,1.3rem);font-weight:500;letter-spacing:.22em;text-transform:uppercase;color:var(--cream);margin-bottom:14px}
p{font-size:.95rem;font-weight:300;letter-spacing:.04em;color:var(--txt2);line-height:1.8;margin-bottom:44px}
.actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:44px}
.btn{display:inline-block;padding:14px 28px;font-family:var(--fi);font-size:10px;letter-spacing:.26em;text-transform:uppercase;text-decoration:none;transition:all .25s ease;border:1px solid var(--border2);color:var(--gold2);background:none}
.btn:hover{border-color:var(--gold);color:var(--gold3)}
.btn--gold{background:var(--gold);color:#0D0B09;border-color:var(--gold)}
.btn--gold:hover{background:var(--gold2);color:#0D0B09}
.search{display:flex;gap:0;max-width:400px;margin:0 auto;border-bottom:1px solid var(--border2)}
.search input{flex:1;background:none;border:none;color:var(--cream);font-family:var(--fd);font-size:1rem;letter-spacing:.06em;padding:12px 4px;outline:none}
.search input::placeholder{color:rgba(237,232,222,.28)}
.search button{background:none;border:none;color:var(--gold2);font-family:var(--fi);font-size:10px;letter-spacing:.24em;text-transform:uppercase;cursor:pointer;padding:12px 8px;transition:color .2s}
.search button:hover{color:var(--gold3)}
.btn:focus-visible,.search input:focus-visible,.search button:focus-visible{outline:2px solid var(--gold2);outline-offset:3px}
@media(prefers-reduced-motion:no-preference){.wrap{animation:fadeUp .8s ease both}@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="wrap">
  <img class="mark" src="/products/kaya-kb-mark.png" alt="" aria-hidden="true" style="height:auto"/>
  <div class="code" aria-hidden="true">404</div>
  <span class="rule" aria-hidden="true"></span>
  <h1>This Ritual Does Not Exist</h1>
  <p>The page you're looking for has drifted beyond the ritual house.<br/>Let us guide you back.</p>
  <nav class="actions" aria-label="Helpful links">
    <a class="btn btn--gold" href="/">Return Home</a>
    <a class="btn" href="https://k3bapothecary.com/">Shop K3B</a>
    <a class="btn" href="https://drinkkoda.com/">Shop KODA</a>
  </nav>
  <form class="search" action="/" method="get" role="search" aria-label="Search the site">
    <input type="text" name="q" placeholder="Search rituals, products…" aria-label="Search query"/>
    <button type="submit">Search</button>
  </form>
</main>
</body>
</html>
